# On the server: the same services as docker-compose.yml, behind HTTPS.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Needs DOMAIN and POSTGRES_PASSWORD in .env (compose reads it for these
# substitutions as well as passing it to the app). See deploy/README.md.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  api:
    # Reachable only through Caddy: nothing on the host's network can talk to
    # the app directly, which is what makes trusting forwarded headers safe.
    ports: !reset []
    expose: ["8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://storygen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storygen
      # Caddy terminates TLS; this lets the app see https, so the session
      # cookie is Secure and GitHub's callback is built as https://DOMAIN/...
      FORWARDED_ALLOW_IPS: "*"
      # Pinned here, not left to .env, so the live site's traces are never
      # tagged "development" by a .env copied from a laptop (DST-32).
      LANGFUSE_TRACING_ENVIRONMENT: production
      OTEL_SERVICE_NAME: dastango

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://storygen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storygen
      LANGFUSE_TRACING_ENVIRONMENT: production
      OTEL_SERVICE_NAME: dastango

  # Watches the queue, the API's error rate and the disk, and emails the owner
  # through Healthchecks.io when something is wrong (docs/MONITORING.md). The
  # same image as the others; it serves nothing. Without MONITOR_PING_BASE in
  # .env it only logs what it finds.
  monitor:
    image: storygen:local
    command: ["python", "main.py", "monitor"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://storygen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/storygen
      DATA_DIR: /app/data
    volumes:
      # The API writes its request log here, and the disk it measures is this one.
      - ${DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No web server to ask: the loop touches this file every pass, so a monitor
    # that has hung turns unhealthy instead of looking fine.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /tmp/storygen-monitor-alive -mmin -3 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"       # Let's Encrypt's challenge, then a redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificates: kept, or every restart re-issues
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
