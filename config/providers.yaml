# Which model serves each job.
#
# Every agent asks for a ROLE (story, edit_intent, translate, image, tts, music)
# and gets the first provider in that role's list whose credentials are present.
# If it fails at runtime, the next one is tried. So: put the best provider first,
# keep a free/offline one last, and never hard-code a model in agent code.
#
# `requires` lists the environment variables a provider needs (see .env.example);
# "A|B" means either will do. A provider with no `requires` always works offline.
# `concurrency` is how many calls that provider tolerates in parallel, and
# `retries` how many attempts it gets before the next provider takes over. A
# 429 that says the provider's daily quota is used up is not retried: the next
# provider takes over at once (rule in shared/providers.py, DST-20). A 402 (no
# balance left) is not retried either.
# `timeout_s` is the longest one call may wait for the provider; then it counts
# as failed and the next provider takes over at once (a timeout is not retried).
# Without it: story 180 s, edit_intent and translate 60 s, image 120 s, tts 60 s,
# anything else 120 s (DEFAULT_TIMEOUT_S in shared/providers.py).
#
# Override the whole file with PROVIDERS_FILE=/path/to/providers.yaml, or force a
# single provider for a role with PROVIDER_STORY / PROVIDER_IMAGE / ... =name.

version: 1

roles:
  # ---- Writing the script (structured JSON out) --------------------------
  # Groq first (DST-15): in the DST-10 baseline Gemini hung once for 36 min, hit
  # the 180 s timeout 7 times and ran out of daily quota mid-run. OpenAI and
  # Anthropic adapters still exist in llm_client; add them back here once a key
  # exists (the project has none at $0).
  story:
    - provider: groq              # free tier at console.groq.com
      model: openai/gpt-oss-120b  # open-weight (Apache 2.0)
      requires: [GROQ_API_KEY]
    - provider: openrouter        # free tier at openrouter.ai
      model: openrouter/free      # routes to whichever free model fits the request
      requires: [OPENROUTER_API_KEY]
    - provider: gemini            # free tier at aistudio.google.com/app/apikey
      model: gemini-flash-latest  # alias: always the current Flash, never a retired id
      requires: [GEMINI_API_KEY]
    - provider: ollama            # local models; set OLLAMA_HOST=http://localhost:11434
      model: qwen3:4b
      requires: [OLLAMA_HOST]
    - provider: mock              # deterministic template script, no network

  # ---- Classifying a natural-language edit (small, fast, cheap) ----------
  edit_intent:
    - provider: gemini
      model: gemini-flash-latest
      requires: [GEMINI_API_KEY]
    - provider: groq
      model: openai/gpt-oss-20b
      requires: [GROQ_API_KEY]
    - provider: openrouter
      model: openrouter/free
      requires: [OPENROUTER_API_KEY]
    - provider: ollama
      model: qwen3:4b
      requires: [OLLAMA_HOST]
    - provider: mock              # keyword + regex classifier

  # ---- Subtitle translation ---------------------------------------------
  translate:
    - provider: gemini
      model: gemini-flash-latest
      requires: [GEMINI_API_KEY]
    - provider: groq
      model: openai/gpt-oss-120b
      requires: [GROQ_API_KEY]
    - provider: openrouter
      model: openrouter/free
      requires: [OPENROUTER_API_KEY]
    - provider: ollama
      model: qwen3:4b
      requires: [OLLAMA_HOST]
    - provider: mymemory          # free, no key (~5k chars/day; MYMEMORY_EMAIL raises it)

  # ---- Scene images and character portraits ------------------------------
  image:
    - provider: cloudflare        # free: 10k neurons/day ~= 170 images
      model: "@cf/black-forest-labs/flux-1-schnell"
      params: {steps: 8}          # max 8; square output, cropped to the project size
      requires: [CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN]
      concurrency: 4
      retries: 3                  # free endpoints hiccup; retry before falling through
      timeout_s: 180              # the limit this call already had before timeouts were configurable
    - provider: local_sd          # in-process diffusers; needs CUDA torch (docs/DEVELOPMENT.md)
      model: stabilityai/sdxl-turbo
      params: {steps: 4}
      requires: [LOCAL_SD]
      concurrency: 1              # one GPU pipeline, no parallel calls
    - provider: sd_webui          # Automatic1111 / ComfyUI HTTP API
      requires: [SD_API_URL]
      concurrency: 1
      timeout_s: 300              # a local GPU at 20 steps is slow; the limit it already had
    # Agnes AI (DST-22) takes Pollinations' place: after Cloudflare, so a render
    # is not left with placeholders when Cloudflare's daily allowance is gone.
    # DEV/TEST ONLY: on its free tier Agnes may train on the prompts it is sent
    # (docs/PROVIDERS.md), so the key belongs in a developer's .env, not on a
    # server that renders other people's films. Without the key it is skipped.
    - provider: agnes
      model: agnes-image-2.1-flash
      params: {tier: 1K}          # 1K is 1312x736 at 16:9; free limit is per minute (20 at 1K)
      requires: [AGNES_API_KEY]
      concurrency: 2              # ~14 s an image (measured 2026-11-02): 2 at once stays well under 20/min
      retries: 3                  # a 429 here is the per-minute limit, so a short wait is right
      timeout_s: 120              # Agnes advises 60-360 s; one image took 14 s
    # Pollinations is switched off (DST-22): the keyless endpoint 402s and serves a
    # weaker model, and the keyed one has no pollen left. The adapter is still in
    # image_gen_tool.py; to bring it back, restore this entry above `openai`:
    #   - provider: pollinations
    #     model: tongyi-mai/z-image-turbo
    #     concurrency: 1
    #     retries: 3
    - provider: openai            # paid: only reached if the free ones above fail
      model: dall-e-3
      requires: [OPENAI_API_KEY]
      concurrency: 2
    - provider: placeholder       # offline gradient, always works
      concurrency: 1              # pure Python drawing: threads only add overhead

  # ---- Character voices ---------------------------------------------------
  tts:
    - provider: kokoro            # open-source, offline, Apache-2.0; no key, no GPU.
      requires: [KOKORO_MODEL]    # uv sync --extra voices
      concurrency: 2              # then: python scripts/get_kokoro.py
    - provider: elevenlabs
      requires: [ELEVENLABS_API_KEY]
      concurrency: 2
    - provider: edge              # free Microsoft neural voices, no key
      concurrency: 4
    - provider: gtts
      concurrency: 4
    - provider: pyttsx3           # offline
      concurrency: 1
    - provider: silent            # last resort: silence of the right length

  # ---- Real motion: a still becomes a moving shot -------------------------
  # Everything here except `ffmpeg` costs money per clip, so the chain ends on
  # the offline animator rather than failing. `ffmpeg` is not a downgrade to be
  # ashamed of: it renders supersampled camera moves (see video_agent/camera.py).
  # Free first, deliberately. This project runs at zero spend, so a provider
  # that charges per clip does not get to be the default just because it is
  # better — each one needs its own env var set on purpose.
  video:
    - provider: fal               # ~$1 of free trial credit at fal.ai
      model: fal-ai/stable-video-diffusion
      requires: [FAL_KEY|FAL_API_KEY]
      concurrency: 2
    - provider: huggingface       # free tier, noticeably lower quality
      requires: [HF_TOKEN|HUGGINGFACE_API_KEY]
      concurrency: 1
    # Paid. Reachable only by setting the extra flag/token below, never by
    # holding a key for something else. Veo 3.1 is the best of these by a wide
    # margin if the budget constraint ever lifts.
    - provider: gemini_veo        # BILLED PER SECOND; not in the Gemini free tier
      model: veo-3.1-fast-generate-preview
      requires: [GEMINI_API_KEY, VIDEO_BUDGET_OK]   # second one is the opt-in
      concurrency: 1
    - provider: replicate         # paid per second
      requires: [REPLICATE_API_TOKEN]
      concurrency: 2
    - provider: ffmpeg            # offline camera moves on the still. Always works.

  # ---- Lip sync -------------------------------------------------------------
  lipsync:
    - provider: fal
      requires: [FAL_KEY|FAL_API_KEY]
      concurrency: 2
    - provider: replicate
      requires: [REPLICATE_API_TOKEN]
      concurrency: 2
    - provider: none              # heuristic mouth animation in the animator

  # ---- Background music ----------------------------------------------------
  music:
    - provider: ffmpeg            # mood-keyed synthesised bed, offline
