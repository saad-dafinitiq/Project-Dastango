# The one list of Python dependencies. `uv.lock` pins every one of them, and
# everything below, to an exact version: the Docker image, CI and a laptop all
# install from that lock, so a rebuild cannot pull something different (F11).
#
#   uv sync                      the app and the test tools
#   uv sync --extra voices       ... plus Kokoro voices (also: postgres, s3, tracing)
#   uv add <package>             add a dependency, then commit pyproject.toml and uv.lock
#   uv lock --upgrade-package <package>    move one package to its newest version
#
# This is an application, not a library: nothing here is built or published.

[project]
name = "storygen"
version = "0.0.0"
description = "Dastango: one prompt in, a short animated film out."
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0.0",

    # Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # Media
    "Pillow>=10.0",
    "gTTS>=2.4",
    "edge-tts>=7.0.0",
    "requests>=2.31",            # also calls MyMemory, the subtitle fallback (DST-18)

    # Model settings layer (config/providers.yaml)
    "PyYAML>=6.0",

    # Accounts: argon2id password hashing (never hand-roll this).
    "argon2-cffi>=23.1",

    # Database: the version log and the job queue. SQLite by default (no server
    # needed); set DATABASE_URL to a Postgres URL and add the postgres extra.
    "SQLAlchemy>=2.0",

    # LLM providers (all optional at run time, installed so any key just works).
    # The openai client also speaks to Groq, OpenRouter and Ollama.
    "google-genai>=1.51",        # Gemini (replaces the deprecated google-generativeai)
    "openai>=1.20",
    "anthropic>=0.25",

    # Real video / lip-sync providers (optional at run time)
    "fal-client>=1.0.0",         # fal.ai SVD + SadTalker (set FAL_KEY in .env)
    "replicate>=1.0.0",          # Replicate Wav2Lip + SVD (set REPLICATE_API_TOKEN in .env)

    # Optional / nice-to-have
    "pyttsx3>=2.90",             # offline TTS fallback
    # moviepy and opencv-python were listed as optional extras; nothing imports
    # either, and together they put ~265 MB (and a second ffmpeg) in the image.
    "numpy>=1.26",               # used by some optional paths
]

[project.optional-dependencies]
# Postgres driver: only needed when DATABASE_URL points at Postgres.
#   DATABASE_URL=postgresql+psycopg://user:pass@host/dbname
postgres = ["psycopg[binary]>=3.1"]

# Object storage: only needed when STORAGE_URL points at an S3-compatible bucket
# (AWS S3, MinIO, or Cloudflare R2's free 10 GB tier).
s3 = ["boto3>=1.34"]

# Open-source offline voices. No PyTorch, no API key, no GPU needed. Then:
#   python scripts/get_kokoro.py        # ~340 MB of model files
voices = [
    "kokoro-onnx>=0.4",          # Kokoro TTS (Apache-2.0) on onnxruntime
    "soundfile>=0.12",           # writing the generated audio
]

# Tracing every model call to Langfuse, Cloud or self-hosted (docs/TRACING.md).
# Pinned exactly: shared/tracing.py was written against this version's API
# (start_observation, create_trace_id, propagate_attributes), and an unreviewed
# release must not change what is sent.
tracing = ["langfuse==5.0.4"]

[dependency-groups]
# What the tests need. `uv sync` installs this group by default, and so does the
# image: its CI job runs the font, boot-race and voice tests inside it.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",       # provides the @pytest.mark.timeout used by the integration test
    "httpx>=0.27",               # required by FastAPI TestClient
    "moto>=5",                   # a local fake of S3, for the off-machine backup tests
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    # The tests listed in SLOW in tests/conftest.py (those that took 5 s or more:
    # renders, edits, voices, the whole pipeline). Pull-request CI skips them with
    # -m "not slow"; a plain `pytest -q`, which runs all of them, is what Gate 1
    # requires before every commit.
    "slow: took 5 s or more when timed; skipped on pull requests, run in the full suite",
]
