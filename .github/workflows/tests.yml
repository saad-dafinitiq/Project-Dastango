name: tests

# What gates a pull request. The slower, wider matrix (Windows, the second
# Python version) runs weekly instead: see full-matrix.yml and docs/TESTING.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run already in flight for it. A
# push to main never cancels another: each merge keeps its own result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether anything but documentation changed. It is a job, not a
    # `paths-ignore` on the workflow, on purpose: a workflow that is skipped
    # that way reports nothing, and a required check that never reports leaves
    # the pull request waiting forever. A job skipped by `if` reports as
    # skipped, which satisfies a required check.
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "changed in this pull request:"; echo "$files"
            # Documentation only (every file under docs/ or a Markdown file) is
            # the one case that skips the tests; the rule, and why doubt runs
            # them, is in scripts/ci_changed.py, which is unit-tested.
            code=$(echo "$files" | python3 scripts/ci_changed.py)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "run the test jobs: $code"

  test:
    # Python 3.11 is what the production image runs (Dockerfile). On a pull
    # request this runs the tests that are not marked `slow` (-m "not slow"; the
    # list is SLOW in tests/conftest.py), split into two slices that run as
    # separate jobs on separate machines (TEST_SHARD). Each slice runs its tests
    # one at a time, like a local run, so tests that assert a wall-clock bound see
    # a quiet machine. The slow tests run in the weekly full-matrix workflow, on
    # demand, and locally (Gate 1 requires the whole suite before every commit).
    # It does not run when a pull request merges to main: the pull request's run
    # tested the very same merged result (web and image still run, below). A manual
    # run of this workflow runs everything. GitHub cannot make a check required on
    # this plan, so the job names are free to change.
    name: ubuntu-latest · python 3.11 · slice ${{ matrix.slice }} of 2
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-env
        with:
          python: "3.11"

      - name: Every module imports
        # A syntax error in a file no test touches should still fail the build.
        run: uv run --no-sync python -m compileall -q agents backend jobs mcp shared state_manager main.py

      - name: Tests
        # The suite runs fully offline: the mock LLM writes the script and
        # images are the local placeholder, so no key is needed and none of
        # this spends anyone's quota.
        # Why slices and not pytest-xdist workers: measured on two CPUs (4 Nov
        # 2026), 2 workers took 573 s against 676 s for the serial run. Every
        # test already uses both cores (ffmpeg and the shot renderer are
        # multi-threaded), so extra workers on the same machine mostly share
        # them; slices on separate machines add cores.
        # --durations lists the slowest tests in the log, so what CI spends its
        # time on is read from CI itself. Only a pull request skips the slow
        # tests; a manual run (workflow_dispatch) runs the whole suite, still in
        # two slices.
        run: >
          uv run --no-sync python -m pytest -q --timeout=600 --durations=15
          ${{ github.event_name == 'pull_request' && '-m "not slow"' || '' }}
        env:
          PIPELINE_SKIP_DOTENV: "1"
          TEST_SHARD: ${{ matrix.slice }}/2

  web:
    name: web · build and typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Build the static export
        # next build also type-checks; it runs first so next-env.d.ts exists
        # for the stand-alone check below.
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: The export is what FastAPI serves
        run: |
          test -f out/index.html
          test -f out/studio/index.html
          test -f out/docs/index.html
          test -f out/docs/editing/index.html
          test -f out/icon.svg
          echo "export OK: $(find out -name '*.html' | wc -l) pages"

  image:
    # The image is what the server runs, and the one place its fonts, ffmpeg
    # build and Python wheels exist together — so it is built and checked on
    # every change rather than discovered on deploy day.
    name: image · build and run
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storygen:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What the server needs is in it
        run: >
          docker run --rm storygen:local python -c
          "import kokoro_onnx, soundfile, onnxruntime, psycopg, boto3, argon2;
          print('voices, Postgres and S3 drivers present')"

      - name: Subtitles render in every script, first boot doesn't race, voices can't crash it
        # Run inside the image: these are about its fonts, its database
        # drivers and its voice libraries, not the runner's.
        run: >
          docker run --rm -e PIPELINE_SKIP_DOTENV=1 storygen:local
          python -m pytest -q -p no:cacheprovider
          tests/unit/test_m9_subtitle_fonts.py tests/unit/test_m9_schema_race.py
          tests/unit/test_m9_system_voices.py

      - name: The whole stack starts on a fresh database and answers
        env:
          DATA_PATH: ${{ runner.temp }}/storygen-data
          HOST_PORT: "8000"
        run: |
          mkdir -p "$DATA_PATH" && chmod 777 "$DATA_PATH"
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/auth/status | grep -q '"needs_setup":true'
          docker compose ps
          # A crash on first boot shows up as a restart, even if it recovered.
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q api)")" = 0
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q worker)")" = 0

      - name: Logs, if anything above failed
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
